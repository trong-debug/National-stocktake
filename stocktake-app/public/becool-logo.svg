<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#5dd5f2"/>
      <stop offset="55%" stop-color="#1da8d4"/>
      <stop offset="100%" stop-color="#0a6e9e"/>
    </radialGradient>
  </defs>

  <!-- Outer dark navy ring -->
  <circle cx="100" cy="100" r="99" fill="#1b3d6c"/>
  <!-- Outer white ring -->
  <circle cx="100" cy="100" r="91" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Blue gradient fill -->
  <circle cx="100" cy="100" r="88" fill="url(#bg)"/>
  <!-- Inner white ring -->
  <circle cx="100" cy="100" r="71" fill="none" stroke="white" stroke-width="2.5"/>

  <!-- Snowflake — 6 arms via rotation -->
  <g stroke="white" stroke-linecap="round" fill="none">
    <!-- 3 main axes (60° apart gives 6-point) -->
    <g stroke-width="10">
      <line x1="100" y1="38" x2="100" y2="162"/>
      <line x1="100" y1="38" x2="100" y2="162" transform="rotate(60 100 100)"/>
      <line x1="100" y1="38" x2="100" y2="162" transform="rotate(120 100 100)"/>
    </g>
    <!-- Upper inner branches -->
    <g stroke-width="5">
      <line x1="100" y1="62" x2="83"  y2="45" />
      <line x1="100" y1="62" x2="117" y2="45" />
      <line x1="100" y1="62" x2="83"  y2="45"  transform="rotate(60 100 100)"/>
      <line x1="100" y1="62" x2="117" y2="45"  transform="rotate(60 100 100)"/>
      <line x1="100" y1="62" x2="83"  y2="45"  transform="rotate(120 100 100)"/>
      <line x1="100" y1="62" x2="117" y2="45"  transform="rotate(120 100 100)"/>
    </g>
    <!-- Lower inner branches -->
    <g stroke-width="5">
      <line x1="100" y1="138" x2="83"  y2="155"/>
      <line x1="100" y1="138" x2="117" y2="155"/>
      <line x1="100" y1="138" x2="83"  y2="155" transform="rotate(60 100 100)"/>
      <line x1="100" y1="138" x2="117" y2="155" transform="rotate(60 100 100)"/>
      <line x1="100" y1="138" x2="83"  y2="155" transform="rotate(120 100 100)"/>
      <line x1="100" y1="138" x2="117" y2="155" transform="rotate(120 100 100)"/>
    </g>
    <!-- Mid branches -->
    <g stroke-width="4">
      <line x1="100" y1="78" x2="86"  y2="64" />
      <line x1="100" y1="78" x2="114" y2="64" />
      <line x1="100" y1="78" x2="86"  y2="64"  transform="rotate(60 100 100)"/>
      <line x1="100" y1="78" x2="114" y2="64"  transform="rotate(60 100 100)"/>
      <line x1="100" y1="78" x2="86"  y2="64"  transform="rotate(120 100 100)"/>
      <line x1="100" y1="78" x2="114" y2="64"  transform="rotate(120 100 100)"/>
      <line x1="100" y1="122" x2="86"  y2="136"/>
      <line x1="100" y1="122" x2="114" y2="136"/>
      <line x1="100" y1="122" x2="86"  y2="136" transform="rotate(60 100 100)"/>
      <line x1="100" y1="122" x2="114" y2="136" transform="rotate(60 100 100)"/>
      <line x1="100" y1="122" x2="86"  y2="136" transform="rotate(120 100 100)"/>
      <line x1="100" y1="122" x2="114" y2="136" transform="rotate(120 100 100)"/>
    </g>
  </g>

  <!-- "BE COOL" curved text at top -->
  <path id="topArc" d="M 20,105 A 80,80 0 0,1 180,105" fill="none"/>
  <text fill="white" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="17" letter-spacing="5">
    <textPath href="#topArc" startOffset="16%">BE COOL</textPath>
  </text>

  <!-- "REFRIGERATED COURIERS" curved text at bottom -->
  <path id="botArc" d="M 16,96 A 84,84 0 0,0 184,96" fill="none"/>
  <text fill="white" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="10.5" letter-spacing="1.2">
    <textPath href="#botArc" startOffset="6%">REFRIGERATED COURIERS</textPath>
  </text>
</svg>
