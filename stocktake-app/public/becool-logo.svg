<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">

  <!-- Dark navy outer band (contains text) -->
  <circle cx="100" cy="100" r="99" fill="#0c2461"/>

  <!-- Vivid teal / cyan ring -->
  <circle cx="100" cy="100" r="82" fill="#00b4d8"/>

  <!-- Thin white separator ring -->
  <circle cx="100" cy="100" r="73" fill="white"/>

  <!-- Light sky-blue background ring -->
  <circle cx="100" cy="100" r="68" fill="#7ecfe8"/>

  <!-- White centre circle — snowflake sits on this -->
  <circle cx="100" cy="100" r="57" fill="white"/>

  <!-- Snowflake: 6 arms (centre-to-tip, rotated), each with 2 branch pairs -->
  <!-- Arm length: 54px (tip at y=46). Branch 1 at y=68 (60%), Branch 2 at y=57 (80%) -->
  <g stroke="#00b4d8" stroke-linecap="round" fill="none">

    <g>
      <line x1="100" y1="100" x2="100" y2="46" stroke-width="11"/>
      <line x1="100" y1="68"  x2="83"  y2="51" stroke-width="7"/>
      <line x1="100" y1="68"  x2="117" y2="51" stroke-width="7"/>
      <line x1="100" y1="57"  x2="87"  y2="44" stroke-width="5"/>
      <line x1="100" y1="57"  x2="113" y2="44" stroke-width="5"/>
    </g>

    <g transform="rotate(60 100 100)">
      <line x1="100" y1="100" x2="100" y2="46" stroke-width="11"/>
      <line x1="100" y1="68"  x2="83"  y2="51" stroke-width="7"/>
      <line x1="100" y1="68"  x2="117" y2="51" stroke-width="7"/>
      <line x1="100" y1="57"  x2="87"  y2="44" stroke-width="5"/>
      <line x1="100" y1="57"  x2="113" y2="44" stroke-width="5"/>
    </g>

    <g transform="rotate(120 100 100)">
      <line x1="100" y1="100" x2="100" y2="46" stroke-width="11"/>
      <line x1="100" y1="68"  x2="83"  y2="51" stroke-width="7"/>
      <line x1="100" y1="68"  x2="117" y2="51" stroke-width="7"/>
      <line x1="100" y1="57"  x2="87"  y2="44" stroke-width="5"/>
      <line x1="100" y1="57"  x2="113" y2="44" stroke-width="5"/>
    </g>

    <g transform="rotate(180 100 100)">
      <line x1="100" y1="100" x2="100" y2="46" stroke-width="11"/>
      <line x1="100" y1="68"  x2="83"  y2="51" stroke-width="7"/>
      <line x1="100" y1="68"  x2="117" y2="51" stroke-width="7"/>
      <line x1="100" y1="57"  x2="87"  y2="44" stroke-width="5"/>
      <line x1="100" y1="57"  x2="113" y2="44" stroke-width="5"/>
    </g>

    <g transform="rotate(240 100 100)">
      <line x1="100" y1="100" x2="100" y2="46" stroke-width="11"/>
      <line x1="100" y1="68"  x2="83"  y2="51" stroke-width="7"/>
      <line x1="100" y1="68"  x2="117" y2="51" stroke-width="7"/>
      <line x1="100" y1="57"  x2="87"  y2="44" stroke-width="5"/>
      <line x1="100" y1="57"  x2="113" y2="44" stroke-width="5"/>
    </g>

    <g transform="rotate(300 100 100)">
      <line x1="100" y1="100" x2="100" y2="46" stroke-width="11"/>
      <line x1="100" y1="68"  x2="83"  y2="51" stroke-width="7"/>
      <line x1="100" y1="68"  x2="117" y2="51" stroke-width="7"/>
      <line x1="100" y1="57"  x2="87"  y2="44" stroke-width="5"/>
      <line x1="100" y1="57"  x2="113" y2="44" stroke-width="5"/>
    </g>

  </g>

  <!-- "BE COOL" curved text at top — sits in the navy band -->
  <path id="topArc" d="M 18,100 A 82,82 0 0,1 182,100" fill="none"/>
  <text fill="white" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="17" letter-spacing="5">
    <textPath href="#topArc" startOffset="14%">BE COOL</textPath>
  </text>

  <!-- "REFRIGERATED COURIERS" curved text at bottom — sits in the navy band -->
  <path id="botArc" d="M 15,101 A 85,85 0 0,0 185,101" fill="none"/>
  <text fill="white" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="10" letter-spacing="1.3">
    <textPath href="#botArc" startOffset="5.5%">REFRIGERATED COURIERS</textPath>
  </text>

</svg>
